name: E2E

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  e2e-default:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare test version
        id: prepare-test-version
        run: |
          short_sha=$(echo "${SHA}" | cut -c1-7)
          version="$short_sha.minor.patch"
          echo "version=$version" >> $GITHUB_OUTPUT
        env:
          SHA: ${{ github.event.pull_request.head.sha }}

      - name: Create test tag
        uses: ovsds/create-or-update-ref-action@1157b2991820188d5a8e6f22656775d1d171f762 # v1.1.0
        with:
          ref: "tags/${{ steps.prepare-test-version.outputs.version }}"
          sha: d9c6b9a24622ab2ce0c608c2207e5a80301a3d1a

      - name: Test Run
        id: test-run
        uses: $/
        with:
          version: ${{ steps.prepare-test-version.outputs.version }}

      - name: Test Run to validate overwriting
        id: test-run2
        uses: $/
        with:
          version: ${{ steps.prepare-test-version.outputs.version }}

      - name: Delete test tag
        if: success() || failure()
        uses: $/.github/actions/delete-ref-action
        with:
          ref: "tags/${{ steps.prepare-test-version.outputs.version }}"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete major test tag
        if: success() || failure()
        uses: $/.github/actions/delete-ref-action
        with:
          ref: "tags/${{ steps.test-run.outputs.major_version }}"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete minor test tag
        if: success() || failure()
        uses: $/.github/actions/delete-ref-action
        with:
          ref: "tags/${{ steps.test-run.outputs.minor_version }}"
          github_token: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    if: always() && !cancelled()

    permissions: {}

    needs:
      - e2e-default

    steps:
      - name: Collect Results
        uses: ovsds/collect-needs-result-action@12190e2a1bfe85d9c024f190a3833973e97998f8 # v1.0.0
        with:
          needs_json: ${{ toJson(needs) }}
          skip_allowed: false
